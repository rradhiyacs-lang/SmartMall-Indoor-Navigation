<!DOCTYPE html>
<html>
<head>
    <title>SmartMall</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            margin: 0;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 25px;
        }

        .box {
            background: white;
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 12px;
            width: 60%;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            background: #1677ff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ SmartMall</h1>
    <p>Find products inside the mall</p>
</header>

<div class="box">

    <input id="search" placeholder="Search product...">

    <button onclick="searchProduct()">Search</button>

    <div id="result"></div>

</div>

<script>

const products = [
    {
        name: "KitKat",
        price: 40,
        store: "Reliance Smart",
        floor: "2nd Floor",
        section: "Chocolate Section"
    },
    {
        name: "Dairy Milk",
        price: 50,
        store: "Spencer's",
        floor: "1st Floor",
        section: "Chocolate Section"
    },
    {
        name: "Laptop Charger",
        price: 1500,
        store: "Croma",
        floor: "3rd Floor",
        section: "Computer Accessories"
    }
];

function searchProduct() {

    let search = document
        .getElementById("search")
        .value
        .toLowerCase();

    let product = products.find(item =>
        item.name.toLowerCase().includes(search)
    );

    let result = document.getElementById("result");

    if (!product) {
        result.innerHTML = "<h3>❌ Product not found</h3>";
        return;
    }

    result.innerHTML = `
        <h2>${product.name}</h2>

        <p>💰 Price: ₹${product.price}</p>
        <p>🏪 Store: ${product.store}</p>
        <p>📍 Floor: ${product.floor}</p>
        <p>🗂️ Section: ${product.section}</p>
        <p>✅ Available</p>

        <button onclick="navigate()">
            Navigate
        </button>

        <div id="route"></div>
    `;
}

function navigate() {

    document.getElementById("route").innerHTML = `
        <hr>
        <h3>🗺️ Route</h3>

        <p>Entrance</p>
        ↓
        <p>Lift</p>
        ↓
        <p>2nd Floor</p>
        ↓
        <p>Store</p>
        ↓
        <p>Chocolate Section</p>

        <p>📍 You have arrived!</p>
    `;
}

</script>

</body>
</html>
